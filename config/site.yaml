# =============================================================================
# Default Cover List
# =============================================================================
# defaultCoverList:
#   - /img/cover/1.webp
#   - https://example.com/custom-cover.webp

# =============================================================================
# Content Processing Options
# 内容处理选项 - 控制文章渲染和交互行为
# =============================================================================
content:
  addBlankTarget: true # 外部链接新窗口打开
  smoothScroll: true # 平滑滚动
  addHeadingLevel: true # 标题锚点
  enhanceCodeBlock: true # 增强代码块
  enableCodeCopy: true # 代码复制按钮
  enableCodeFullscreen: true # 代码全屏按钮
  enableLinkEmbed: true # 链接卡片预览
  enableCodePenEmbed: true # CodePen 嵌入
  enableTweetEmbed: true # 推文嵌入
  enableOGPreview: true # OG 预览卡片
  previewCacheTime: 30 # 预览缓存时间(天)
  lazyLoadEmbeds: true # 延迟加载嵌入
  postCardImagePosition: alternating # 文章卡片封面图位置在首页的显示控制 alternating 默认交替显示 left 封面图始终在左侧 right 封面图始终在右侧
  enableShokaContainers: true   # :::提醒块 ;;;标签卡 +++折叠块
  enableShokaAttrs: true        # [text]{.class} 属性语法
  enableShokaEffects: true      # ++下划线++ ==高亮== ~下标~ ^上标^
  enableShokaSpoiler: true      # !!隐藏文字!!
  enableShokaRuby: true         # {文字^注音} 注音标注
  enableShokaHexoTags: true     # {% links %} {% media %} Hexo标签
  enableMath: true              # $数学公式$ KaTeX渲染
  enableCodeMeta: true          # 代码块增强 (title, mark, command)
  enableQuiz: true              # 练习题交互功能
  enableEncryptedBlock: true    # :::encrypted{password="..."} 加密内容块

# =============================================================================
# Moments Archive (optional)
# 碎碎念动态归档 - 默认关闭；启用时还需配置 KOHARU_SUITE_URL 和 dynamic Docker target
# =============================================================================
moments:
  enabled: false
  path: moments # Jalur URL, misal /moments
  title: 碎碎念 # Judul halaman
  description: 记录频道中的日常消息 # Deskripsi halaman

# =============================================================================
# Navigation Routes
# 导航菜单配置 - 定义顶部导航栏的菜单项 (Pengaturan Menu Navigasi Atas)
# =============================================================================
navigation:
  - name: Home
    nameKey: nav.home
    path: /
    icon: ri:home-heart-fill
  # aktifkan lagi moment jika koharu suite eksternal sudah aktif, dan jangan lupa atur .env nya
  #- name: Moments
  #  nameKey: nav.moments
  #  path: /moments
  # icon: ri:chat-smile-3-fill
  - name: About
    nameKey: nav.about
    icon: fa6-regular:circle-user
    children:
      - name: About Me
        path: /about
        icon: fa6-regular:circle-user
      - name: Friends
        nameKey: nav.friends
        path: /friends
        icon: ri:links-line
      - name: Contact Us
        path: /contact
        icon: ri:mail-send-line
      - name: Privacy Policy
        path: /privacy
        icon: ri:shield-user-line
      - name: TOC
        path: /terms
        icon: ri:file-text-line
      - name: Disclaimer
        path: /disclaimer
        icon: ri:error-warning-line
  - name: Weekly
    nameKey: nav.weekly
    path: /weekly
    icon: ri:newspaper-line
  # Optional explicit Moments position. When omitted, enabled Moments is inserted after Archives.
  # - feature: moments
  #   icon: ri:chat-smile-3-fill
  - name: Posts
    nameKey: nav.posts
    icon: ri:quill-pen-ai-fill
    children:
      - name: Categories
        nameKey: nav.categories
        path: /categories
        icon: ri:grid-fill
      - name: Tags
        nameKey: nav.tags
        path: /tags
        icon: fa6-solid:tags
      - name: Archives
        nameKey: nav.archives
        path: /archives
        icon: ri:archive-2-fill
  - name: Music
    nameKey: nav.music
    path: /music
    icon: ri:music-2-fill
    
