# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
# =============================================================================
# Site Configuration
# =============================================================================
# This file contains all site-specific configurations.
# Modify this file to customize your blog.
# After changes, rebuild the site: docker compose up -d --build
# =============================================================================

# =============================================================================
# Site Basic Information
# =============================================================================
site:
  title: "Catatan Pribadi dan Artikel" # 网站名称
  alternate: "SHL PROJECT" # 网站英文名称 用于页脚、Logo、@ handle 等
  subtitle: "Amalan yang paling dicintai Allah adalah amalan yang rutin dilakukan meskipun sedikit" # 网站副标题
  name: SHL # 作者名称 - 请修改为你的名字 [ID] UBAH: Nama panggilan Anda
  description: Dari Ilmu ke Amal, Dari Teori ke Praktik # 网站描述 [ID] UBAH: Deskripsi web untuk SEO Google
  avatar: /img/avatarnews.gif # 网站头像 [ID] URL Foto Profil (Biarkan dulu jika belum diganti fotonya)
  showLogo: false # 是否显示 Logo
  author: shl project # 作者名称 - 请修改为你的名字 [ID] UBAH: Nama lengkap Anda
  url: https://shlproject.com/ # 站点 URL 用于 RSS 和 SEO [ID] UBAH: Masukkan link web Vercel Anda di sini
  defaultOgImage: /img/avatarnews.gif # 默认 Open Graph 图片
  startYear: 1998 # 建站年份 [ID] Tahun rilis web (Bisa diubah ke 2025 atau 2026)
  timezone: Asia/Jakarta # 时区配置 (IANA 格式)，用于日期显示和处理 [ID] UBAH: Ganti menjadi Asia/Jakarta
  keywords: # SEO 关键词 (全局) [ID] Kata kunci pencarian web Anda
    - Blog # [ID] Blog
    - Astro # [ID] Astro
    - Ekonomi # [ID] Ekonomi
    - Manajemen # [ID] Manajemen
    - Bisnis # [ID] Teknologi
    - Fiqh # [ID] Front-end (Ganti kata-kata kunci ini sesuai topik web Anda)
    # 请根据你的网站内容添加关键词
  # breadcrumbHome: 首页  # 面包屑导航中首页的显示名称（默认: '首页'）
  # icp:                         # ICP 备案号（可自定义链接）
  #   text: "粤ICP备xxxxxxxxxx号"
  #   link: "https://beian.miit.gov.cn/"
  # Enable slug transliteration (converts CJK characters to pinyin/romaji)
  # Note: enabling this will break existing CJK URLs. Run `pnpm save-slugs` first to save old slugs into frontmatter.link
  # enableSlugTransliteration: true

# =============================================================================
# Internationalization (i18n)
# 国际化配置 - 控制多语言支持
# =============================================================================
# defaultLocale: 默认语言代码（URL 不带前缀）
# locales: 支持的语言列表
#   - code: 语言代码（BCP 47 短格式，如 'zh', 'en', 'ja'）
#   - label: 语言显示名称（如 '中文', 'English'）
# -----------------------------------------------------------------------------
i18n:
  defaultLocale: en # [ID] UBAH: Ganti 'zh' menjadi 'en' agar bahasanya berubah jadi Inggris
  locales:
    - code: en
      label: English
    # - code: zh
    #   label: 中文
    # - code: ja
    #   label: 日本語

# =============================================================================
# Category Map
# Maps Chinese category names to URL-friendly English slugs
# (Pengaturan Peta Kategori - Mengubah nama kategori menjadi URL yang ramah SEO)
# =============================================================================
categoryMap:
  # [ID] Kategori Utama Pilihan Anda
  Ekonomi: ekonomi # [ID] Kategori Ekonomi
  Manajemen: manajemen # [ID] Kategori Manajemen
  Bisnis: bisnis # [ID] Kategori Bisnis
  Fiqh: fiqh # [ID] Kategori Fiqh / Fikih
  App: app # [ID] Kategori Aplikasi / Tools
  
  # Primary categories (Kategori Bawaan Tema)
  随笔: life # [ID] Catatan: life
  笔记: note # [ID] Catatan Kuliah: note
  工具: tools # [ID] Alat: tools
  Weekly: weekly # [ID] Mingguan: weekly
  # Secondary categories (for nested paths)
  前端: front-end # [ID] Front-end
  # Add more as needed:
  # 书摘: reading
  # 后端: back-end
  # 算法: algorithm
  # 项目: project

# =============================================================================
# Featured Categories (Homepage)
# 首页精选分类 - 在首页以卡片形式展示的分类入口
# =============================================================================
# 字段说明：
#   link: 分类链接路径，对应 categoryMap 中的英文 slug
#   label: 卡片上显示的分类名称
#   image: 封面图片路径（相对于 public 目录）
#   description: 分类描述文字，显示在卡片上
# -----------------------------------------------------------------------------
featuredCategories:
  - link: ekonomi # [ID] Sesuai dengan kategori slug di categoryMap
    label: Ekonomi # [ID] Judul yang tampil di atas gambar
    image: https://img.shlproject.com/2026/09/4600f7785b8310af77250d81c86abaf7.webp
    description: Catatan seputar ekonomi # [ID] Deskripsi singkat
  - link: manajemen
    label: Manajemen
    image: https://img.shlproject.com/2026/09/f9ae56d7fb17dcfcf7b56d0f8b06d322.webp
    description: Teori dan praktik manajemen
  - link: bisnis
    label: Bisnis
    image: https://img.shlproject.com/2026/09/023764d2f389f4aa2a56bd1b41472c5d.webp
    description: Dunia bisnis dan strategi
  - link: fiqh
    label: Fiqh
    image: https://img.shlproject.com/2026/09/af463e67eee50cf53a2248d07cb2cc73.webp
    description: Kajian ilmu fiqh

# =============================================================================
# Featured Series
# 精选系列功能 - 用于展示定期更新的系列内容（支持多个系列）
# =============================================================================
# 字段说明：
#   slug: URL 路径（必填），如 'weekly' 对应 /weekly 路径
#         注意：不能与保留路由冲突，包括：about, categories, tags, friends, posts, archives, api, _astro, rss.xml, sitemap.xml, robots.txt, favicon.ico 等
#   categoryName: 对应的分类名称（必填，需在 categoryMap 中存在）
#   label: 侧边栏/导航中显示的简短名称（可选）
#   fullName: 系列页面标题显示的完整名称（可选）
#   description: 系列介绍文字，支持多行 Markdown（可选）
#   cover: 系列页面头图路径，相对于 public 目录（可选）
#   enabled: 是否启用此系列，设为 false 可关闭（可选，默认 true）
#   icon: 导航图标，Iconify 格式如 'ri:newspaper-line'（可选）
#   highlightOnHome: 是否在首页高亮显示最新文章（可选，默认 true，显式设为 false 可禁用）
#   links: 相关链接配置（可选）
# -----------------------------------------------------------------------------
featuredSeries:
  - slug: weekly # URL 路径: /weekly
    categoryName: Weekly # 必须与 categoryMap 中的分类名匹配
    label: Weekly # 简短名称 [ID] UBAH: Nama pendek seri di sidebar
    fullName: Weekly # 完整名称 [ID] UBAH: Nama panjang seri
    description: | # 支持多行 Markdown [ID] UBAH: Deskripsi seri (boleh teks panjang)
      Khusus di halaman ini, saya kumpulin catatan pribadi. Isinya campur aduk, kadang soal ekonomi atau bisnis, kadang tips belajar maupun fiqih, kadang juga hal-hal random yang lagi bikin penasaran atau sekadar hobi. Semua ditulis santai, diperbarui sesekali, siapa tahu ada yang berguna atau minimal bisa jadi teman baca.
    cover: https://img.shlproject.com/2026/09/4600f7785b8310af77250d81c86abaf7.webp # 系列页面头图
    enabled: true # 启用此系列
    icon: ri:newspaper-line # 导航图标
    links: # 相关链接（可选）
      github: https://github.com/your-username/your-repo # (可选) GitHub 仓库
      rss: /rss.xml # (可选) RSS 订阅链接
      # chrome: https://chromewebstore.google.com/detail/your-extension-id # (可选) 浏览器插件
      # docs: https://your-docs-url # (可选) 文档链接
  # 示例：添加第二个系列（取消注释启用）
  # - slug: reading # URL 路径: /reading
  #   categoryName: 书摘
  #   label: 读书笔记
  #   fullName: 我的读书笔记
  #   description: 阅读记录与读后感
  #   cover: /img/weekly_header.webp # 记得添加，我这里就是个示例
  #   enabled: true
  #   icon: ri:book-read-line

# =============================================================================
# Social Links
# 社交链接 - 显示在页脚和个人信息区域
# =============================================================================
# 字段说明：
#   url: 链接地址（邮箱需加 mailto: 前缀）
#   icon: Iconify 图标标识，格式为 "集合:图标名"
#         图标查询：https://icon-sets.iconify.design/ri/
#   color: (可选) 图标颜色，十六进制格式如 '#191717'
# -----------------------------------------------------------------------------
# 添加新平台：复制现有配置块，修改键名和各字段值即可
# -----------------------------------------------------------------------------
social:
  github:
    url: https://github.com/your-username # [ID] Ganti dengan link GitHub Anda
    icon: ri:github-fill
    color: '#191717'
  email:
    url: mailto:your@email.com # [ID] Ganti dengan email Anda
    icon: ri:mail-line
    color: '#55acd5'
  rss:
    url: /rss.xml
    icon: ri:rss-line
    color: '#ff6600'
  # [ID] Tambahan Media Sosial Baru
  youtube:
    url: https://youtube.com/@your-username # [ID] Ganti dengan link channel YouTube Anda
    icon: ri:youtube-fill
    color: '#ff0000'
  facebook:
    url: https://facebook.com/your-username # [ID] Ganti dengan link Facebook Anda
    icon: ri:facebook-fill
    color: '#1877f2'
  telegram:
    url: https://t.me/your-username # [ID] Ganti dengan link Telegram Anda
    icon: ri:telegram-fill
    color: '#229ed9'
  # -------------------------------------------------------------------------
  # 以下是更多可选的社交平台配置示例，取消注释并修改即可启用：
  # -------------------------------------------------------------------------
  # twitter:
  #   url: https://x.com/your-handle
  #   icon: ri:twitter-fill
  #   color: '#4b9ae4'
  # bilibili:
  #   url: https://space.bilibili.com/your-id
  #   icon: ri:bilibili-fill
  #   color: '#da708a'
  # zhihu:
  #   url: https://www.zhihu.com/people/your-id
  #   icon: ri:zhihu-fill
  #   color: '#1e88e5'
  # music:
  #   url: https://music.163.com/#/user/home?id=your-id
  #   icon: ri:netease-cloud-music-line
  #   color: '#e60026'

# =============================================================================
# Friends Links
# 友情链接页面配置 - 展示友链列表和申请说明 (Konfigurasi halaman tautan teman - Menampilkan daftar tautan teman dan instruksi pengajuan)
# =============================================================================
# intro: 页面介绍文字配置 (Konfigurasi teks pengenalan halaman)
#   title: 页面标题 (Judul halaman)
#   subtitle: 页面副标题 (Sub-judul halaman)
#   applyTitle: 申请区块标题 (Judul blok pengajuan/form)
#   applyDesc: 申请说明文字 (Teks penjelasan pengajuan)
#   exampleYaml: 申请格式示例（YAML 格式） (Contoh format pengajuan dalam format YAML)
# data: 友链列表数组 (Array daftar tautan teman)
#   - site: 站点名称 (Nama situs/blog)
#   - url: 站点地址 (Alamat URL situs)
#   - owner: 站长昵称 (Nama panggilan pemilik situs)
#   - desc: 站点描述/简介 (Deskripsi/pengenalan singkat situs)
#   - image: 头像图片 URL (URL gambar profil/avatar)
#   - color: (可选) 卡片背景色，十六进制格式 (Opsional: Warna latar belakang kartu, format heksadesimal)
# -----------------------------------------------------------------------------
friends:
  intro:
    title: Tautan Teman # 友情链接 - 页面标题 [ID] Judul Halaman Teman
    subtitle: Mari bertukar link! # 欢迎交换友链！ - 页面副标题 [ID] Sub-judul
    applyTitle: Pengajuan Link Teman # 申请友链 - 申请区块标题 [ID] Judul form
    applyDesc: Silakan tinggalkan pesan di halaman ini dengan format berikut # 请在本页留言，格式如下 - 申请说明 [ID] Keterangan
    exampleYaml: | # 申请格式示例，会显示在页面上
      - site: Nama Blog Anda # 你的博客名称 - 站点名称
        url: https://your-blog.com/ # 站点网址
        owner: Nama Panggilan Anda # 你的昵称 - 昵称
        desc: Deskripsi singkat situs Anda # 站点简介 - 站点简介
        image: https://your-blog.com/avatar.jpg # 头像链接
        color: "#ffc0cb" # 主题色（可选）
  data: # 友链列表 [ID] Daftar Teman yang Tampil
    - site: Teman A # 余弦の博客
      url: www.shlproject.com
      owner: Shl Project
      desc: FE / ACG / Kerajinan tangan / Pecandu Dark Mode / INFP / Otaku dengan banyak hobi & 2 kucing / remote # FE / ACG / 手工 / 深色模式强迫症 / INFP / 兴趣广泛养两只猫的老宅女 / remote
      image: https://blog.cosine.ren/img/avatar.webp
      color: '#ed788b'
    - site: Contoh Blog A # 示例博客 A
      url: https://example-a.com
      owner: Alice
      desc: Seorang developer yang menyukai teknologi # 一个热爱技术的开发者
      image: https://api.dicebear.com/7.x/avataaars/svg?seed=Alice
      color: '#BEDCFF'
    - site: Contoh Blog B # 示例博客 B
      url: https://example-b.com
      owner: Bob
      desc: Tempat kecil untuk berbagi kehidupan dan teknologi # 分享生活与技术的小站
      image: https://api.dicebear.com/7.x/avataaars/svg?seed=Bob
      color: '#FBC1CC'
    - site: Contoh Blog C # 示例博客 C
      url: https://example-c.com
      owner: Carol
      desc: Tempat mencatat proses belajar dan berkembang # 记录学习与成长的地方
      image: https://api.dicebear.com/7.x/avataaars/svg?seed=Carol
      color: '#ABDCFF'

